<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clock</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Space+Grotesk:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="clock-container">

        <!-- Main Clock -->
        <section class="clock">

            <div class="time" id="time">
                00:00:00
            </div>

            <div class="date" id="date">
                Loading...
            </div>

            <div class="timezone" id="timezone">
                Loading timezone...
            </div>

        </section>


        <!-- Information -->
        <section class="info">

            <div class="info-card">
                <span class="label">DAY</span>
                <span class="value" id="day">---</span>
            </div>

            <div class="info-card">
                <span class="label">WEATHER</span>
                <span class="value" id="weather">Loading...</span>
            </div>

        </section>


        <!-- Controls -->
        <section class="tools">

            <button onclick="showStopwatch()">STOPWATCH</button>
            <button onclick="showTimer()">TIMER</button>

        </section>


        <!-- Stopwatch -->
        <section class="panel" id="stopwatch">

            <div class="panel-title">STOPWATCH</div>

            <div class="panel-time" id="stopwatchDisplay">
                00:00:00
            </div>

            <div class="panel-buttons">
                <button onclick="startStopwatch()">START</button>
                <button onclick="pauseStopwatch()">PAUSE</button>
                <button onclick="resetStopwatch()">RESET</button>
            </div>

        </section>


        <!-- Timer -->
        <section class="panel hidden" id="timer">

            <div class="panel-title">TIMER</div>

            <div class="timer-input">

                <input
                    type="number"
                    id="timerMinutes"
                    placeholder="MIN"
                    min="0"
                >

                <input
                    type="number"
                    id="timerSeconds"
                    placeholder="SEC"
                    min="0"
                    max="59"
                >

            </div>

            <div class="panel-time" id="timerDisplay">
                00:00
            </div>

            <div class="panel-buttons">

                <button onclick="startTimer()">START</button>
                <button onclick="pauseTimer()">PAUSE</button>
                <button onclick="resetTimer()">RESET</button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
